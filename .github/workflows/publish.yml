name: Publish

# A tag push is the release: one released version is one tag, and nothing else
# publishes. `workflow_dispatch` exists for re-running a failed publish of the
# tag that is already out, without cutting a new version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # OIDC: this is what lets npm verify the workflow instead of asking for a
  # one-time password no runner can provide, and what records provenance.
  id-token: write
  # The release step writes to the repository.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `registry-url`: that option writes an `.npmrc` holding
      # `${NODE_AUTH_TOKEN}`, and an unset token then resolves to an empty bearer
      # that makes the OIDC path fail with 401. The default registry is already
      # registry.npmjs.org, so the file is only created when a token exists.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Publishing a stale vendored renderer would ship a terminal that does not
      # match the sources next to it, so the tag must carry a current build.
      - name: The committed chunk is current
        run: |
          npm run build
          git diff --exit-code -- client.xterm.js

      - name: Test
        run: npm test

      # A version can only be published once, and re-running this workflow for a
      # tag that is already out must not fail the run. Ask the registry first and
      # publish only if it looks new.
      #
      # The pre-check is a fast path, not the guarantee: the registry reads are
      # served from a CDN that can lag a manual `npm publish` by minutes, so this
      # can answer "not published" for a version that exists. The publish step
      # below therefore also treats a conflict as success rather than relying on
      # this answer being fresh.
      - name: Is this version already on npm?
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Two supported routes, chosen by whether the secret exists:
      #
      #   NPM_TOKEN set    -> token auth. Required for the very first publish,
      #                       because npm cannot be told to trust this workflow
      #                       until the package exists.
      #   NPM_TOKEN absent -> OIDC trusted publishing. Delete the secret once the
      #                       package is registered on npmjs.com as a trusted
      #                       publisher, and no credential remains in this repo.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "::notice::Publishing with the NPM_TOKEN secret."
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "::notice::No NPM_TOKEN secret; publishing over OIDC trusted publishing."
          fi

          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          # "cannot publish over the previously published versions" arrives as
          # EPUBLISHCONFLICT or as a bare 403. Either way the version is already
          # out, which is the state this job wanted to reach.
          if grep -qiE 'EPUBLISHCONFLICT|cannot publish over|previously published' /tmp/publish.log; then
            echo "::notice::This version already exists on npm; nothing to upload."
            exit 0
          fi
          exit "${status}"

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || gh release view "$GITHUB_REF_NAME"
