name: Test

on:
  push:
    branches: [main]
    # Documentation cannot change a test outcome, and a matrix of seven jobs for
    # a README edit is pure noise. This only skips when *every* changed path is
    # ignored; touching any source file still runs the whole suite.
    #
    # Caveat: a skipped run reports no check at all. If this workflow is ever
    # made a required status check, a docs-only PR would sit blocked forever —
    # drop these filters at that point, or add a separate always-run gate.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

# Pushing twice in a row should cancel the older run rather than queue behind it:
# only the newest commit's result decides whether main is green.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Nothing here talks to a registry or writes to the repository, so the default
# read-only token is all it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin is pure JavaScript with no platform branch, so the point of
        # the matrix is to keep it that way rather than to cover real differences.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `--ignore-scripts` is the important flag here, and it is not about
      # security. `ssh2` declares `"install": "node install.js"`, which runs
      # `node-gyp rebuild` to build an optional native crypto binding that this
      # plugin never needs — the pure-JavaScript path is what ships and what runs.
      # On a cold Windows runner that compile dominates the job: measured at
      # 122s of a 124s job, against 5s on Ubuntu where the build finds no
      # toolchain and gives up immediately. `--omit=optional` does not help,
      # because the script belongs to ssh2 itself, which is a real dependency.
      - name: Install
        run: npm ci --omit=optional --ignore-scripts

      - name: Host tests
        run: node test/host.test.mjs

      - name: Client tests
        run: node test/client.test.mjs

      - name: Pane tests
        run: node test/panes.test.mjs

  # The vendored renderer is committed, because the package works without a build
  # step. That only stays true if the committed copy is the one the script
  # produces, so this job rebuilds it and fails on any difference.
  chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The renderer and the fit addon are plain JavaScript, so no install script
      # is needed to rebuild the chunk either.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Rebuild the vendored renderer
        run: npm run build

      - name: The committed chunk is current
        run: git diff --exit-code -- client.xterm.js
